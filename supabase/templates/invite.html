<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#f5f7f3;color:#17231d;font-family:Arial,sans-serif;padding:32px 16px">
    <div style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #dfe6df;border-radius:16px;padding:32px">
      <p style="margin:0 0 8px;color:#176b49;font-size:12px;font-weight:700;letter-spacing:2px">SAL DA TERRA</p>
      <h1 style="margin:0 0 16px;font-size:26px">Você recebeu um convite</h1>
      <p style="margin:0 0 24px;line-height:1.6;color:#526158">Use o botão abaixo para confirmar seu e-mail e definir sua senha de acesso. O convite é pessoal e não deve ser encaminhado.</p>
      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=invite" style="display:inline-block;background:#176b49;color:#ffffff;text-decoration:none;font-weight:700;border-radius:10px;padding:14px 20px">Aceitar convite</a>
      <p style="margin:24px 0 0;font-size:12px;line-height:1.5;color:#647268">Se você não esperava este convite, ignore esta mensagem.</p>
    </div>
  </body>
</html>
